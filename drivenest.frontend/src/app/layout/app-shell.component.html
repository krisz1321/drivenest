<div class="dashboard dashboard-theme">
  <app-sidebar [active]="active" [displayName]="displayName" (signOut)="signOut()" />

  <main [attr.id]="active === 'dashboard' ? 'overview' : null">
    <header class="topbar"><span>Garázs <span class="separator">/</span><strong>{{ section }}</strong></span><span class="date">{{ dateLabel }}</span></header>
    <header class="mobile-head">
      @if (vehicle; as car) {
        <button type="button" class="car-button" (click)="pickerOpen = !pickerOpen" [attr.aria-expanded]="pickerOpen" aria-label="Jármű választása">
          <span class="car-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M4 17v-5l2.2-5.2A2 2 0 0 1 8 5.5h8a2 2 0 0 1 1.8 1.3L20 12v5"/><path d="M3 12h18v5H3z"/><path d="M6 17v2M18 17v2"/></svg></span>
          <span class="car-text"><strong>{{ car.make }} {{ car.model }}</strong><small>{{ car.licensePlate }} · {{ km(car) }}</small></span>
          <svg class="icon chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button type="button" class="head-button" (click)="downloadBook(car)" [disabled]="pdfLoading" aria-label="Szervizkönyv letöltése">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        </button>
      } @else if (loaded) {
        <a class="car-button" routerLink="/garage"><span class="car-text"><strong>Nincs még jármű</strong><small>Jármű hozzáadása</small></span></a>
      }

      @if (pickerOpen) {
        <div class="picker-backdrop" (click)="pickerOpen = false"></div>
        <ul class="picker">
          @for (car of vehicles; track car.id) {
            <li><button type="button" [class.active]="car.id === vehicle?.id" (click)="choose(car)"><strong>{{ car.make }} {{ car.model }}</strong><small>{{ car.licensePlate }}</small></button></li>
          }
        </ul>
      }
    </header>
    @if (pdfError) { <p class="alert-error mobile-alert" role="alert">{{ pdfError }}</p> }
    <div class="page-content"><ng-content /></div>
  </main>

  <nav class="tabbar" aria-label="Fő navigáció">
    <a class="tab" [class.active]="active === 'history'" routerLink="/history">
      <i><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></i>Előzmények
    </a>
    <a class="tab" [class.active]="active === 'statistics'" routerLink="/statistics">
      <i><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></i>Statisztikák
    </a>
    <a class="fab" routerLink="/refuelings" aria-label="Új bejegyzés">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </a>
    <a class="tab" [class.active]="active === 'reminders'" routerLink="/reminders">
      <i><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></i>Emlékeztetők
    </a>
    <a class="tab" [class.active]="moreActive" routerLink="/more">
      <i><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></i>Több
    </a>
  </nav>
</div>
