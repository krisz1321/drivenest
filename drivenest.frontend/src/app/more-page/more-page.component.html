<app-shell active="more" section="Több">

      <a class="menu-item" routerLink="/garage"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17v-5l2.2-5.2A2 2 0 0 1 8 5.5h8a2 2 0 0 1 1.8 1.3L20 12v5"/><path d="M3 12h18v5H3z"/><path d="M6 17v2M18 17v2"/></svg>Járműveim</a>
      <a class="menu-item" routerLink="/dashboard"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Vezérlőpult</a>
      <hr>

</app-shell>
